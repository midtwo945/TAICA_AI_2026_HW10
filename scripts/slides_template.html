<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformer 教學簡報</title>
<meta name="description" content="用 LLM Wiki 製作的教學簡報：從 Attention 到 Transformer，再到 BERT、GPT-3、T5、ViT。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2328; --muted:#6b6f76; --line:#e3ddd0;
  --accent:#c2410c; --accent-soft:#fde7da; --code-bg:#f1ece2; --heat:#c2410c;
  --shadow:0 10px 40px rgba(60,40,10,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1e2127; --ink:#e8e6e1; --muted:#9aa0a8; --line:#2e333b;
    --accent:#fb923c; --accent-soft:#3a2516; --code-bg:#2a2e36; --heat:#fb923c;
    --shadow:0 10px 40px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1e2127; --ink:#e8e6e1; --muted:#9aa0a8; --line:#2e333b;
  --accent:#fb923c; --accent-soft:#3a2516; --code-bg:#2a2e36; --heat:#fb923c;
  --shadow:0 10px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
  line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
.deck{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px 72px}
.slide{display:none;width:min(1120px,100%);height:min(calc((100vw - 32px)*9/16), calc(100vh - 96px));
  min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:clamp(20px,3.2vw,44px) clamp(20px,4vw,56px) clamp(14px,2vw,22px);flex-direction:column;overflow:hidden}
.slide.active{display:flex;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide header{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.kicker{color:var(--accent);font-weight:700}
h2{font-size:clamp(1.35rem,2.6vw,2.15rem);margin:.25em 0 .45em;line-height:1.3}
h3{font-size:1.05rem;margin:.8em 0 .3em}
.body{flex:1;overflow:auto;font-size:clamp(.92rem,1.45vw,1.12rem);padding-right:4px}
.body>ul{margin:0;padding-left:1.2em}
.body>ul>li{margin:.38em 0}
.body li::marker{color:var(--accent)}
.body ul ul,.body ol{margin:.25em 0 .35em;padding-left:1.3em;color:var(--ink)}
.body ul ul li,.body ol li{margin:.15em 0;font-size:.95em}
strong{color:var(--accent);font-weight:700}
code{font-family:"JetBrains Mono",ui-monospace,monospace;background:var(--code-bg);padding:.08em .38em;border-radius:5px;font-size:.88em;word-break:break-word}
.src{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--muted)}
.src a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.src a:hover{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.8rem}
/* 封面 */
.title-slide h2{font-size:clamp(1.7rem,3.6vw,2.9rem);margin-top:.6em}
.subtitle{font-size:clamp(1rem,1.8vw,1.35rem);color:var(--muted);margin:0 0 1em}
.timeline-list{list-style:none;padding:0;margin:0}
.timeline-list>li{margin:0}
.timeline-list ul{list-style:none;padding:0;margin:.4em 0 .6em;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.timeline-list ul li{background:var(--accent-soft);border-radius:10px;padding:.5em .75em;font-size:.88em;margin:0}
/* 表格 */
table{border-collapse:collapse;width:100%;margin:.5em 0;font-size:.92em}
th,td{border-bottom:1px solid var(--line);padding:.4em .6em;text-align:left;vertical-align:top}
thead th{color:var(--muted);font-weight:500;font-size:.9em}
/* demo */
.two-col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.two-col .demo{margin-top:0}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.demo{margin:.5em 0 .2em;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.demo-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;font-size:.85em;color:var(--muted)}
.switch{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink);font-weight:500;
  background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.switch input{accent-color:var(--accent);width:16px;height:16px}
.heat{max-width:520px;margin:.6em 0 .3em}
.heat td{text-align:center;font-family:"JetBrains Mono",monospace;position:relative;
  background:color-mix(in srgb,var(--heat) calc(var(--w)*85%),transparent);transition:background .35s}
.heat td span{position:relative}
/* 測驗 */
.quiz details{border:1px solid var(--line);border-radius:10px;padding:.5em .8em;margin:.4em 0;background:var(--bg)}
.quiz summary{cursor:pointer;font-weight:500}
.quiz details p{margin:.4em 0 0;color:var(--accent)}
.refs{padding-left:1.3em;font-size:.88em} .refs li{margin:.2em 0}
.refs a{color:var(--ink)}
/* 控制列 */
.nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:12px}
.nav button{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;
  width:44px;height:44px;cursor:pointer;font-size:1.1rem}
.nav button:hover{border-color:var(--accent);color:var(--accent)}
.nav button:disabled{opacity:.35;cursor:default}
.counter{min-width:64px;text-align:center;font-size:.85rem;color:var(--muted)}
.progress{position:fixed;left:0;top:0;height:3px;background:var(--accent);transition:width .3s}
.theme{position:fixed;right:16px;top:12px;font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);
  color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.hint{position:fixed;left:16px;top:12px;font-size:.75rem;color:var(--muted)}
@media (max-width:760px){
  .deck{padding:44px 12px 68px;align-items:stretch}
  .slide{height:auto;min-height:0;max-height:calc(100vh - 116px)}
  .hint{display:none}
}
@media print{
  body{overflow:visible} .nav,.progress,.theme,.hint{display:none}
  .slide{display:flex!important;page-break-after:always;box-shadow:none;height:auto}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<span class="hint">← → 或空白鍵翻頁</span>
<button class="theme" id="theme" type="button">深色／淺色</button>
<main class="deck" id="deck">
<!--SLIDES-->
</main>
<nav class="nav" aria-label="翻頁">
  <button type="button" id="prev" aria-label="上一頁">←</button>
  <span class="counter" id="counter"></span>
  <button type="button" id="next" aria-label="下一頁">→</button>
</nav>
<script>
(function(){
  const slides=[...document.querySelectorAll('.slide')];
  const total=slides.length;
  let i=0;
  function show(n){
    i=Math.max(0,Math.min(total-1,n));
    slides.forEach((s,k)=>s.classList.toggle('active',k===i));
    document.getElementById('counter').textContent=(i+1)+' / '+total;
    document.getElementById('progress').style.width=((i+1)/total*100)+'%';
    document.getElementById('prev').disabled=i===0;
    document.getElementById('next').disabled=i===total-1;
    if(location.hash!=='#'+(i+1)) history.replaceState(null,'','#'+(i+1));
  }
  document.getElementById('prev').onclick=()=>show(i-1);
  document.getElementById('next').onclick=()=>show(i+1);
  document.addEventListener('keydown',e=>{
    const tg=e.target; if(tg&&tg.closest&&tg.closest('input,summary')&&e.key===' ') return;
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}
    else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
    else if(e.key==='Home') show(0); else if(e.key==='End') show(total-1);
  });
  let x0=null,y0=null;
  document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) show(i+(dx<0?1:-1));
    x0=null;
  },{passive:true});
  window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n) show(n-1)});
  const t=document.getElementById('maskToggle');
  if(t) t.addEventListener('change',()=>{
    document.querySelectorAll('.heat tbody').forEach(b=>b.hidden=(b.dataset.mode==='on')!==t.checked);
  });
  const root=document.documentElement;
  try{const saved=localStorage.getItem('theme'); if(saved) root.dataset.theme=saved;}catch(e){}
  document.getElementById('theme').onclick=()=>{
    const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark';
    try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
  };
  show((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
